plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.juancavr6.regibot'
    compileSdk 35

    defaultConfig {
        applicationId "com.juancavr6.regibot"
        minSdk 30
        targetSdk 34
        versionCode 2
        versionName "1.1"
        resConfigs "en", "es"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // MediaPipe 0.10.14 does not ship an x86_64 JNI library.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    //MediaPipe dependency
    //new release
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    //TensorFlow Lite dependency
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'

    //GSON
    implementation 'com.google.code.gson:gson:2.10.1'

    //Lottie for animations
    implementation 'com.airbnb.android:lottie:6.4.0'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.preference
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

// A Git LFS pointer is text, not a model. Reject missing or changed assets at build time.
tasks.register('verifyModelAssets') {
    def checksumFile = rootProject.file('models.sha256')
    inputs.file(checksumFile)
    inputs.dir('src/main/assets')
    doLast {
        checksumFile.eachLine { line ->
            if (!line.trim().isEmpty()) {
                def parts = line.trim().split(/\s+/, 2)
                def asset = file("src/main/assets/${parts[1]}")
                if (!asset.isFile()) throw new GradleException("Missing model: ${asset.name}")
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                asset.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = stream.read(buffer)) > 0) digest.update(buffer, 0, count)
                }
                if (digest.digest().encodeHex().toString() != parts[0]) {
                    throw new GradleException("Model checksum mismatch: ${asset.name}; restore the real binary, not an LFS pointer")
                }
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyModelAssets') }
