[project]
name = "android-cloud-lab"
version = "0.1.0"
description = "Headless Android QA lab for user-supplied APKs"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
lab = "android_lab.cli:main"

[tool.setuptools]
packages = ["android_lab"]

[tool.setuptools.package-data]
android_lab = ["default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
norecursedirs = ["archive", ".tools", ".venv", ".tmp", "artifacts"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
