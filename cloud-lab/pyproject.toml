[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "android-cloud-lab"
version = "0.2.0"
description = "Production-ready Android virtualization fleet on Proxmox with Android 16 support"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.2",
    "requests>=2.28.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
dev = [
    "black==24.10.0",
    "ruff==0.8.0",
    "mypy==1.13.0",
]

[project.scripts]
lab = "orchestrator.cli:main"

[tool.setuptools]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
